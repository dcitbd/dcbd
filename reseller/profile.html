<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>রিসেলার শপ প্রোফাইল (Editable) | Dream Cart BD</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/navbar.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/forms.css">
  <link rel="stylesheet" href="/assets/css/notification.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
</head>
<body>
  <div id="navbar-container"></div>
  <div class="dashboard-layout">
    <aside class="dashboard-sidebar">
      <div class="mb-4 text-center">
        <h4 style="color:var(--primary); font-weight:800;">Reseller Portal</h4>
        <div style="font-size:0.8rem; color:var(--text-muted);">Dream Cart BD</div>
      </div>
      <nav class="dashboard-nav">
        <a href="/reseller/dashboard.html" class="dashboard-nav-item"><i class="fas fa-tachometer-alt"></i> ড্যাশবোর্ড</a>
        <a href="/reseller/catalogue.html" class="dashboard-nav-item"><i class="fas fa-tags"></i> রিসেল ক্যাটালগ</a>
        <a href="/reseller/orders.html" class="dashboard-nav-item"><i class="fas fa-boxes"></i> রিসেল অর্ডারসমূহ</a>
        <a href="/reseller/payments.html" class="dashboard-nav-item"><i class="fas fa-hand-holding-usd"></i> কমিশন উইথড্র</a>
        <a href="/reseller/profile.html" class="dashboard-nav-item active"><i class="fas fa-store"></i> শপ প্রোফাইল (Editable)</a>
        <a href="/reseller/settings.html" class="dashboard-nav-item"><i class="fas fa-cog"></i> সেটিংস</a>
        <a href="javascript:void(0)" onclick="DCBD_Auth.logout()" class="dashboard-nav-item" style="color:var(--danger);"><i class="fas fa-sign-out-alt"></i> লগআউট</a>
      </nav>
    </aside>

    <main class="dashboard-main">
      <h1 class="section-title mb-4">রিসেলার শপ প্রোফাইল (Editable)</h1>
      <div style="max-width:760px; background:var(--bg-surface); padding:2rem; border-radius:var(--radius-md); border:1px solid var(--border-color); box-shadow:var(--shadow-sm);">
        <form id="reseller-profile-editable-form">
          <div class="flex items-center gap-4 mb-4">
            <img id="reseller-preview-logo" src="https://placehold.co/100?text=Shop+Logo" style="width:90px; height:90px; border-radius:var(--radius-sm); object-fit:cover; border:2px solid var(--primary);">
            <div style="flex:1;">
              <label class="form-label">শপ লোগো পরিবর্তন</label>
              <input type="file" id="reseller-file-upload" accept="image/*" class="form-control mb-2" style="font-size:0.85rem;">
              <input type="url" id="reseller-img-url" class="form-control" placeholder="লোগোর ইমেজ লিংক পেস্ট করুন">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div class="form-group"><label class="form-label">শপ আইডি</label><input type="text" id="res-shopid" class="form-control" readonly></div>
            <div class="form-group"><label class="form-label">দোকানের নাম (Shop Name) *</label><input type="text" id="res-shopname" class="form-control" required></div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div class="form-group"><label class="form-label">প্রোপ্রাইটরের নাম *</label><input type="text" id="res-name" class="form-control" required></div>
            <div class="form-group"><label class="form-label">মোবাইল নম্বর *</label><input type="tel" id="res-mobile" class="form-control" required></div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div class="form-group"><label class="form-label">ইমেইল</label><input type="email" id="res-mail" class="form-control"></div>
            <div class="form-group"><label class="form-label">জন্ম তারিখ</label><input type="date" id="res-dob" class="form-control"></div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div class="form-group"><label class="form-label">জাতীয় পরিচয়পত্র নম্বর (NID)</label><input type="text" id="res-nid" class="form-control"></div>
            <div class="form-group"><label class="form-label">ট্রেড লাইসেন্স নম্বর</label><input type="text" id="res-trade" class="form-control"></div>
          </div>

          <div class="form-group"><label class="form-label">দোকানের ঠিকানা</label><textarea id="res-address" class="form-control" rows="2"></textarea></div>

          <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-save"></i> শপ প্রোফাইল সংরক্ষণ করুন</button>
        </form>
      </div>
    </main>
  </div>

  <script src="/assets/js/core/config.js"></script>
  <script src="/assets/js/core/storage.js"></script>
  <script src="/assets/js/core/state.js"></script>
  <script src="/assets/js/core/auth.js"></script>
  <script src="/assets/js/core/router.js"></script>
  <script src="/assets/js/components/navbar.js"></script>
  <script src="/assets/js/components/toast.js"></script>
  <script src="/assets/js/components/forms.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      DCBD_Navbar.render();
      DCBD_Router.guard();
      DCBD_ImagePreview.bind("reseller-file-upload", "reseller-img-url", "reseller-preview-logo");

      const user = DCBD_Auth.getUser() || {};
      document.getElementById("res-shopid").value = user.Shop_ID || "Dcbd-resale-0001";
      document.getElementById("res-shopname").value = user.Shop_Name || "";
      document.getElementById("res-name").value = user.Name || "";
      document.getElementById("res-mobile").value = user.Mobile || "";
      document.getElementById("res-mail").value = user.Mail || "";
      document.getElementById("res-dob").value = user.Date_of_birth || "";
      document.getElementById("res-nid").value = user.NID_Number || "";
      document.getElementById("res-trade").value = user.Trade_Licence_No || "";
      document.getElementById("res-address").value = user.Address || "";
      if (user.Shop_logo) document.getElementById("reseller-preview-logo").src = user.Shop_logo;

      document.getElementById("reseller-profile-editable-form").addEventListener("submit", (e) => {
        e.preventDefault();
        user.Shop_Name = document.getElementById("res-shopname").value;
        user.Name = document.getElementById("res-name").value;
        user.Mobile = document.getElementById("res-mobile").value;
        user.Mail = document.getElementById("res-mail").value;
        user.Date_of_birth = document.getElementById("res-dob").value;
        user.NID_Number = document.getElementById("res-nid").value;
        user.Trade_Licence_No = document.getElementById("res-trade").value;
        user.Address = document.getElementById("res-address").value;
        user.Shop_logo = document.getElementById("reseller-preview-logo").src;
        DCBD_Auth.setUser(user);
        DCBD_Toast.success("সফল", "রিসেলার প্রোফাইল সফলভাবে আপডেট করা হয়েছে!");
      });
    });
  </script>
</body>
</html>
