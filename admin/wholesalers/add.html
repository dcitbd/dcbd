<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Wholesaler (Image Preview) | Dream Cart BD Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/navbar.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/forms.css">
  <link rel="stylesheet" href="/assets/css/notification.css">
</head>
<body>
  <div id="navbar-container"></div>
  <div class="dashboard-layout">
    <main class="dashboard-main" style="max-width:800px; margin:2rem auto;">
      <h1 class="section-title mb-4">নতুন হোলসেলার যোগ করুন (Add Wholesaler)</h1>
      <div style="background:var(--bg-surface); padding:2rem; border-radius:var(--radius-md); border:1px solid var(--border-color); box-shadow:var(--shadow-sm);">
        <form id="admin-add-ws-form">
          <div class="mb-4 p-3 rounded-md" style="background:var(--bg-subtle);">
            <div class="flex items-center gap-4">
              <img id="ws-add-preview" src="https://placehold.co/100?text=Company+Logo" style="width:90px; height:90px; border-radius:var(--radius-sm); object-fit:cover; border:2px solid var(--primary); background:#fff;">
              <div style="flex:1;">
                <label class="form-label">Shop_logo (কম্পিউটার আপলোড বা অনলাইন লিংক প্রিভিউ)</label>
                <input type="file" id="ws-file" accept="image/*" class="form-control mb-2">
                <input type="url" id="ws-url" class="form-control" placeholder="https://example.com/company-logo.jpg">
              </div>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div class="form-group"><label class="form-label">Shop_ID *</label><input type="text" id="w_sid" class="form-control" value="Dcbd-wholesale-0002" required></div>
            <div class="form-group"><label class="form-label">Shop_Name *</label><input type="text" id="w_sname" class="form-control" required></div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div class="form-group"><label class="form-label">Name *</label><input type="text" id="w_name" class="form-control" required></div>
            <div class="form-group"><label class="form-label">Mobile *</label><input type="tel" id="w_mob" class="form-control" required></div>
          </div>
          <div class="form-group"><label class="form-label">Address</label><textarea id="w_addr" class="form-control" rows="2"></textarea></div>
          <div class="grid grid-cols-2 gap-3">
            <div class="form-group"><label class="form-label">Password *</label><input type="password" id="w_pass" class="form-control" value="123456" required></div>
            <div class="form-group"><label class="form-label">Status</label><select id="w_status" class="form-control form-select"><option value="Approved">Approved</option><option value="Pending">Pending</option></select></div>
          </div>
          <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-warehouse"></i> হোলসেলার Wholesalers শীটে যুক্ত করুন</button>
        </form>
      </div>
    </main>
  </div>
  <script src="/assets/js/core/config.js"></script>
  <script src="/assets/js/core/auth.js"></script>
  <script src="/assets/js/core/router.js"></script>
  <script src="/assets/js/components/navbar.js"></script>
  <script src="/assets/js/components/toast.js"></script>
  <script src="/assets/js/components/forms.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      DCBD_Navbar.render();
      DCBD_Router.guard();
      DCBD_ImagePreview.bind("ws-file", "ws-url", "ws-add-preview");
      document.getElementById("admin-add-ws-form").addEventListener("submit", (e) => {
        e.preventDefault();
        DCBD_Toast.success("সফল", "হোলসেলার সফলভাবে Wholesalers শীটে সংরক্ষণ করা হয়েছে!");
        setTimeout(() => window.location.href = "/admin/wholesalers/index.html", 1000);
      });
    });
  </script>
</body>
</html>
