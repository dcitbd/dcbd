<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>লগইন | Dream Cart BD</title>
  <meta name="description" content="Dream Cart BD - সেরা অনলাইন শপিং প্ল্যাটফর্ম। পাইকারি ও খুচরা কেনাকাটার বিশ্বস্ত প্রতিষ্ঠান।">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/navbar.css">
  <link rel="stylesheet" href="/assets/css/product-card.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/forms.css">
  <link rel="stylesheet" href="/assets/css/modal.css">
  <link rel="stylesheet" href="/assets/css/notification.css">
  <link rel="stylesheet" href="/assets/css/voucher.css">
  <link rel="stylesheet" href="/assets/css/chat.css">
  <link rel="stylesheet" href="/assets/css/animation.css">
  <link rel="stylesheet" href="/assets/css/utilities.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
  
</head>
<body>
  <div id="notice-bar-container"></div>
  <div id="navbar-container"></div>

  <main class="container mt-5">
    <div style="max-width:480px; margin:0 auto; background:var(--bg-surface); padding:2.5rem; border-radius:var(--radius-md); border:1px solid var(--border-color); box-shadow:var(--shadow-xl);">
      <h2 class="text-center text-primary mb-2">লগইন করুন</h2>
      <p class="text-center text-muted mb-4">আপনার অ্যাকাউন্টে প্রবেশ করতে তথ্য দিন</p>

      <form id="unified-login-form">
        <div class="form-group">
          <label class="form-label" for="login_role">অ্যাকাউন্ট টাইপ নির্বাচন করুন</label>
          <select id="login_role" class="form-control form-select">
            <option value="Customer">কাস্টমার (Customer)</option>
            <option value="Reseller">রিসেলার (Reseller)</option>
            <option value="WholeSaler">হোলসেলার (WholeSaler)</option>
            <option value="Admin">অ্যাডমিন / ওয়ার্কার (Admin/Worker)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="login_username">মোবাইল নম্বর / ইউজার আইডি</label>
          <input type="text" id="login_username" class="form-control" placeholder="User ID বা মোবাইল নম্বর" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="login_password">পাসওয়ার্ড</label>
          <input type="password" id="login_password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-full mt-3">
          <i class="fas fa-sign-in-alt"></i> লগইন
        </button>

        <div class="text-center mt-4" style="font-size:0.9rem;">
          অ্যাকাউন্ট নেই? <a href="/register.html" style="color:var(--primary); font-weight:700;">এখানে রেজিস্টার করুন</a>
        </div>
      </form>
    </div>
  </main>

  <div id="footer-container"></div>
  <div id="fixed-action-buttons-root"></div>

  <!-- Core Scripts -->
  <script src="/assets/js/core/config.js"></script>
  <script src="/assets/js/core/storage.js"></script>
  <script src="/assets/js/core/state.js"></script>
  <script src="/assets/js/core/security.js"></script>
  <script src="/assets/js/core/validators.js"></script>
  <script src="/assets/js/core/api.js"></script>
  <script src="/assets/js/core/auth.js"></script>
  <script src="/assets/js/core/permissions.js"></script>
  <script src="/assets/js/core/router.js"></script>

  <!-- Components Scripts -->
  <script src="/assets/js/components/toast.js"></script>
  <script src="/assets/js/components/modal.js"></script>
  <script src="/assets/js/components/notice-bar.js"></script>
  <script src="/assets/js/components/search.js"></script>
  <script src="/assets/js/components/product-card.js"></script>
  <script src="/assets/js/components/filters.js"></script>
  <script src="/assets/js/components/pagination.js"></script>
  <script src="/assets/js/components/counter-card.js"></script>
  <script src="/assets/js/components/table.js"></script>
  <script src="/assets/js/components/navbar.js"></script>
  <script src="/assets/js/components/footer.js"></script>

  <!-- Shop Scripts -->
  <script src="/assets/js/shop/products.js"></script>
  <script src="/assets/js/shop/categories.js"></script>
  <script src="/assets/js/shop/brands.js"></script>
  <script src="/assets/js/shop/cart.js"></script>
  <script src="/assets/js/shop/favourite.js"></script>
  <script src="/assets/js/shop/order.js"></script>
  <script src="/assets/js/shop/voucher.js"></script>
  <script src="/assets/js/shop/tracking.js"></script>
  <script src="/assets/js/shop/live-chat.js"></script>
  <script src="/assets/js/shop/product-details.js"></script>
  <script src="/assets/js/shop/landing-page.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      DCBD_NoticeBar.render();
      DCBD_Navbar.render();
      DCBD_Footer.render();
      DCBD_Api.logViewer(document.title);
    });
  </script>
  
  <script>
    document.getElementById("unified-login-form")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const role = document.getElementById("login_role").value;
      const username = document.getElementById("login_username").value.trim();
      const password = document.getElementById("login_password").value.trim();

      DCBD_Toast.info("যাচাইকরণ", "লগইন তথ্য যাচাই করা হচ্ছে...");
      const res = await DCBD_Auth.login(role, { username, password });
      
      if (res && res.success) {
        DCBD_Toast.success("সফল", "লগইন সফল হয়েছে! রিডাইরেক্ট করা হচ্ছে...");
        setTimeout(() => {
          if (role === "Admin") window.location.href = "/admin/dashboard.html";
          else if (role === "Reseller") window.location.href = "/reseller/dashboard.html";
          else if (role === "WholeSaler") window.location.href = "/wholesaler/dashboard.html";
          else window.location.href = "/customer/dashboard.html";
        }, 800);
      } else {
        DCBD_Toast.error("ব্যর্থ", res.message || "ভুল ইউজার আইডি বা পাসওয়ার্ড");
      }
    });
  </script>

</body>
</html>
