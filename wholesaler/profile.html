<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>হোলসেলার প্রোফাইল (Editable) | Dream Cart BD</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/navbar.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/forms.css">
  <link rel="stylesheet" href="/assets/css/notification.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
</head>
<body>
  <div id="navbar-container"></div>
  <div class="dashboard-layout">
    <aside class="dashboard-sidebar">
      <div class="mb-4 text-center">
        <h4 style="color:var(--primary); font-weight:800;">Wholesale Portal</h4>
        <div style="font-size:0.8rem; color:var(--text-muted);">Dream Cart BD</div>
      </div>
      <nav class="dashboard-nav">
        <a href="/wholesaler/dashboard.html" class="dashboard-nav-item"><i class="fas fa-tachometer-alt"></i> ড্যাশবোর্ড</a>
        <a href="/wholesaler/catalogue.html" class="dashboard-nav-item"><i class="fas fa-layer-group"></i> পাইকারি ক্যাটালগ</a>
        <a href="/wholesaler/orders.html" class="dashboard-nav-item"><i class="fas fa-clipboard-list"></i> পাইকারি অর্ডারসমূহ</a>
        <a href="/wholesaler/profile.html" class="dashboard-nav-item active"><i class="fas fa-building"></i> প্রতিষ্ঠান প্রোফাইল (Editable)</a>
        <a href="/wholesaler/settings.html" class="dashboard-nav-item"><i class="fas fa-cog"></i> পাসওয়ার্ড ও সেটিংস</a>
        <a href="javascript:void(0)" onclick="DCBD_Auth.logout()" class="dashboard-nav-item" style="color:var(--danger);"><i class="fas fa-sign-out-alt"></i> লগআউট</a>
      </nav>
    </aside>

    <main class="dashboard-main">
      <h1 class="section-title mb-4">হোলসেলার প্রতিষ্ঠান প্রোফাইল (Editable)</h1>
      <div style="max-width:760px; background:var(--bg-surface); padding:2rem; border-radius:var(--radius-md); border:1px solid var(--border-color); box-shadow:var(--shadow-sm);">
        <form id="wholesaler-profile-editable-form">
          <div class="flex items-center gap-4 mb-4">
            <img id="ws-preview-logo" src="https://placehold.co/100?text=Company+Logo" style="width:90px; height:90px; border-radius:var(--radius-sm); object-fit:cover; border:2px solid var(--primary);">
            <div style="flex:1;">
              <label class="form-label">প্রতিষ্ঠানের লোগো পরিবর্তন</label>
              <input type="file" id="ws-file-upload" accept="image/*" class="form-control mb-2" style="font-size:0.85rem;">
              <input type="url" id="ws-img-url" class="form-control" placeholder="লোগোর সরাসরি লিংক পেস্ট করুন">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div class="form-group"><label class="form-label">শপ আইডি</label><input type="text" id="ws-shopid" class="form-control" readonly></div>
            <div class="form-group"><label class="form-label">প্রতিষ্ঠানের নাম *</label><input type="text" id="ws-shopname" class="form-control" required></div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div class="form-group"><label class="form-label">প্রতিনিধির নাম *</label><input type="text" id="ws-name" class="form-control" required></div>
            <div class="form-group"><label class="form-label">মোবাইল নম্বর *</label><input type="tel" id="ws-mobile" class="form-control" required></div>
          </div>

          <div class="form-group"><label class="form-label">ইমেইল</label><input type="email" id="ws-mail" class="form-control"></div>
          <div class="form-group"><label class="form-label">অফিস বা গুদামের ঠিকানা</label><textarea id="ws-address" class="form-control" rows="3"></textarea></div>

          <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-save"></i> তথ্য সংরক্ষণ করুন</button>
        </form>
      </div>
    </main>
  </div>

  <script src="/assets/js/core/config.js"></script>
  <script src="/assets/js/core/storage.js"></script>
  <script src="/assets/js/core/state.js"></script>
  <script src="/assets/js/core/auth.js"></script>
  <script src="/assets/js/core/router.js"></script>
  <script src="/assets/js/components/navbar.js"></script>
  <script src="/assets/js/components/toast.js"></script>
  <script src="/assets/js/components/forms.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      DCBD_Navbar.render();
      DCBD_Router.guard();
      DCBD_ImagePreview.bind("ws-file-upload", "ws-img-url", "ws-preview-logo");

      const user = DCBD_Auth.getUser() || {};
      document.getElementById("ws-shopid").value = user.Shop_ID || "Dcbd-wholesale-0001";
      document.getElementById("ws-shopname").value = user.Shop_Name || "";
      document.getElementById("ws-name").value = user.Name || "";
      document.getElementById("ws-mobile").value = user.Mobile || "";
      document.getElementById("ws-mail").value = user.Mail || "";
      document.getElementById("ws-address").value = user.Address || "";
      if (user.Shop_logo) document.getElementById("ws-preview-logo").src = user.Shop_logo;

      document.getElementById("wholesaler-profile-editable-form").addEventListener("submit", (e) => {
        e.preventDefault();
        user.Shop_Name = document.getElementById("ws-shopname").value;
        user.Name = document.getElementById("ws-name").value;
        user.Mobile = document.getElementById("ws-mobile").value;
        user.Mail = document.getElementById("ws-mail").value;
        user.Address = document.getElementById("ws-address").value;
        user.Shop_logo = document.getElementById("ws-preview-logo").src;
        DCBD_Auth.setUser(user);
        DCBD_Toast.success("সফল", "হোলসেলার প্রোফাইল সফলভাবে আপডেট করা হয়েছে!");
      });
    });
  </script>
</body>
</html>
