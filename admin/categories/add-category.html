<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Category (Image Preview) | Dream Cart BD Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/navbar.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/forms.css">
  <link rel="stylesheet" href="/assets/css/notification.css">
</head>
<body>
  <div id="navbar-container"></div>
  <div class="dashboard-layout">
    <main class="dashboard-main" style="max-width:800px; margin:2rem auto;">
      <h1 class="section-title mb-4">নতুন ক্যাটাগরি যোগ করুন (Add Category)</h1>
      <div style="background:var(--bg-surface); padding:2rem; border-radius:var(--radius-md); border:1px solid var(--border-color); box-shadow:var(--shadow-sm);">
        <form id="admin-add-cat-form">
          <div class="mb-4 p-3 rounded-md" style="background:var(--bg-subtle);">
            <div class="flex items-center gap-4">
              <img id="cat-preview-img" src="https://placehold.co/100x100?text=Category" style="width:100px; height:100px; object-fit:cover; border-radius:var(--radius-sm); border:2px solid var(--primary); background:#fff;">
              <div style="flex:1;">
                <label class="form-label">Category_Image (কম্পিউটার থেকে আপলোড অথবা লিংক পেস্ট)</label>
                <input type="file" id="cat-file" accept="image/*" class="form-control mb-2">
                <input type="url" id="cat-link" class="form-control" placeholder="https://example.com/cat-image.jpg">
              </div>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div class="form-group"><label class="form-label">Category_ID (Autofill)</label><input type="text" id="cat_id" class="form-control" value="Dcbd-cat-003" readonly></div>
            <div class="form-group"><label class="form-label">Category_Slug (Autofill)</label><input type="text" id="cat_slug" class="form-control" value="Dcbd-cat-003" readonly></div>
          </div>

          <div class="form-group"><label class="form-label">ক্যাটাগরির নাম (Category Name) *</label><input type="text" id="cat_name" class="form-control" required placeholder="যেমন: Cameras & Accessories"></div>

          <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-plus"></i> ক্যাটাগরি Categories শীটে সংরক্ষণ করুন</button>
        </form>
      </div>
    </main>
  </div>

  <script src="/assets/js/core/config.js"></script>
  <script src="/assets/js/core/auth.js"></script>
  <script src="/assets/js/core/router.js"></script>
  <script src="/assets/js/components/navbar.js"></script>
  <script src="/assets/js/components/toast.js"></script>
  <script src="/assets/js/components/forms.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      DCBD_Navbar.render();
      DCBD_Router.guard();
      DCBD_ImagePreview.bind("cat-file", "cat-link", "cat-preview-img");

      document.getElementById("cat_name").addEventListener("input", (e) => {
        const val = e.target.value.toLowerCase().replace(/[^a-z0-9]/g, "-").replace(/-+/g, "-");
        document.getElementById("cat_slug").value = "dcbd-cat-" + (val || "new");
      });

      document.getElementById("admin-add-cat-form").addEventListener("submit", (e) => {
        e.preventDefault();
        DCBD_Toast.success("সফল", "ক্যাটাগরি সফলভাবে Categories শীটে সংরক্ষণ করা হয়েছে!");
        setTimeout(() => window.location.href = "/admin/categories/index.html", 1000);
      });
    });
  </script>
</body>
</html>
